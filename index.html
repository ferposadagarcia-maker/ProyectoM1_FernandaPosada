<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Paletas</title>
  <link rel="stylesheet" href="./ css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <main>

    <h1>Colorfly Studio</h1>
      <h2>Palette</h2>
        <h3>Generador de Colores</h3>

        <br>
        <p>Crea paletas de colores aleatorios</p>

    <div class="controls">
      <button id="btn">Generar Paleta</button>

      <div class="grupo">
        <span>Cantidad de colores</span>
        <select id="colorCount">
          <option value="0">0</option>
          <option value="6">6</option>
          <option value="8">8</option>
          <option value="9">9</option>
        </select>
      </div>  
        
      <div class="grupo">
        <span>Formato:</span>
        <select id="formato">
          <option value="hsl">HSL</option>
          <option value="hex">HEX</option>
        </select>
      </div>
    </div>

    <section id="palette">
        <br>
        <br>
    </section>

  </main>

  <script src="js/script.js"></script>
</body>
</html>
